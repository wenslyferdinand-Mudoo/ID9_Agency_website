name: Validate Sanity draft automation

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/scripts/sanity-create-portfolio-draft.mjs"
      - ".github/workflows/sanity-portfolio-draft.yml"
      - ".github/workflows/sanity-draft-validation.yml"
      - "docs/SANITY_PORTFOLIO_DRAFT_AUTOMATION.md"
  push:
    branches: [main]
    paths:
      - "frontend/scripts/sanity-create-portfolio-draft.mjs"
      - ".github/workflows/sanity-portfolio-draft.yml"
      - ".github/workflows/sanity-draft-validation.yml"
      - "docs/SANITY_PORTFOLIO_DRAFT_AUTOMATION.md"

# Cancel superseded CI runs for the same PR/branch to reduce queue time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-safety-check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 — immutable commit pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        # actions/setup-node v7.1.0 — immutable commit pin.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check frontend/scripts/sanity-create-portfolio-draft.mjs
      - name: Verify staging-only, draft-only and duplicate guardrails
        shell: bash
        run: |
          grep -F "process.env.SANITY_DATASET !== 'staging'" frontend/scripts/sanity-create-portfolio-draft.mjs
          grep -F "perspective: 'raw'" frontend/scripts/sanity-create-portfolio-draft.mjs
          grep -F 'PROJECT_SERVICES:' .github/workflows/sanity-portfolio-draft.yml
          grep -F 'PROJECT_SERVICES' frontend/scripts/sanity-create-portfolio-draft.mjs
          grep -F "SANITY_DATASET: staging" .github/workflows/sanity-portfolio-draft.yml
          grep -F "drafts." frontend/scripts/sanity-create-portfolio-draft.mjs
          if grep -Eiq 'publish\\(|patch\\([^)]*\\)\\.publish|SANITY_DATASET: production' frontend/scripts/sanity-create-portfolio-draft.mjs .github/workflows/sanity-portfolio-draft.yml; then
            echo "Unsafe publish or production target detected."
            exit 1
          fi
