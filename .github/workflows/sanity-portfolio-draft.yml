name: Sanity — create portfolio draft (staging only)

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Portfolio title"
        required: true
        type: string
      slug:
        description: "Lowercase URL slug (kebab-case)"
        required: true
        type: string
      category:
        description: "Existing portfolio category"
        required: true
        type: choice
        options:
          - graphic-design
          - flyers
          - branding
          - web
          - app
          - marketing
          - motion
          - photo
      summary:
        description: "Short public card summary (max 280 characters)"
        required: true
        type: string
      services:
        description: "Optional services separated by |"
        required: false
        type: string
      client:
        description: "Client name (leave blank if not confirmed)"
        required: false
        type: string
      year:
        description: "Year (leave blank if not confirmed)"
        required: false
        type: string
      cover_image_path:
        description: "Repository-relative cover image path"
        required: true
        type: string
      gallery_image_path:
        description: "Optional repository-relative gallery image path"
        required: false
        type: string
      gallery_alt:
        description: "Gallery image alternative text"
        required: false
        type: string
      gallery_caption:
        description: "Gallery image caption"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sanity-portfolio-draft-staging
  cancel-in-progress: false

jobs:
  create-draft:
    name: Create unpublished portfolio draft in Sanity staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sanity-staging
    steps:
      - name: Checkout selected commit
        # actions/checkout v7.0.1 — immutable commit pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # actions/setup-node v7.1.0 — immutable commit pin.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Create draft and upload images
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: staging
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          PROJECT_TITLE: ${{ inputs.title }}
          PROJECT_SLUG: ${{ inputs.slug }}
          PROJECT_CATEGORY: ${{ inputs.category }}
          PROJECT_SUMMARY: ${{ inputs.summary }}
          PROJECT_SERVICES: ${{ inputs.services }}
          PROJECT_CLIENT: ${{ inputs.client }}
          PROJECT_YEAR: ${{ inputs.year }}
          PROJECT_COVER_PATH: ${{ inputs.cover_image_path }}
          PROJECT_GALLERY_PATH: ${{ inputs.gallery_image_path }}
          PROJECT_GALLERY_ALT: ${{ inputs.gallery_alt }}
          PROJECT_GALLERY_CAPTION: ${{ inputs.gallery_caption }}
        run: node frontend/scripts/sanity-create-portfolio-draft.mjs
