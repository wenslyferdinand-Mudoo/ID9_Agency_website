name: Backend Static Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-static.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python syntax and isolated unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend source and tests
        run: python -m compileall -q backend
      - name: Install minimal isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.110.1" \
            "motor==3.3.1" \
            "pymongo==4.5.0" \
            "bcrypt==4.1.3" \
            "PyJWT>=2.10.1" \
            "python-dotenv>=1.0.1" \
            "pydantic>=2.6.4" \
            "email-validator>=2.2.0" \
            "pytest>=8.0.0"
      # Tests replace the database handle with mocks; no MongoDB service or secrets are used.
      - name: Run isolated backend regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_admin_provisioning_unit.py tests/test_blog_visibility_unit.py tests/test_model_defaults_unit.py
