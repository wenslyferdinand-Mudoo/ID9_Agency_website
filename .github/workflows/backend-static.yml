name: Repository Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend syntax and isolated regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.110.1" \
            "motor==3.3.1" \
            "pymongo==4.5.0" \
            "bcrypt==4.1.3" \
            "PyJWT>=2.10.1" \
            "python-dotenv>=1.0.1" \
            "pydantic>=2.6.4" \
            "email-validator>=2.2.0" \
            "pytest>=8.0.0"
      - name: Run isolated backend regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_admin_provisioning_unit.py tests/test_blog_visibility_unit.py tests/test_model_defaults_unit.py

  frontend-validation:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies reproducibly
        working-directory: frontend
        run: npm ci
      - name: Run frontend regression tests
        working-directory: frontend
        env:
          CI: "true"
        # The current main branch has no Jest test files yet. Keep CI green
        # for this baseline while ensuring any discovered tests must pass.
        run: npm test -- --watchAll=false --runInBand --passWithNoTests
      - name: Build frontend for production
        if: always() && !cancelled()
        working-directory: frontend
        run: npm run build
