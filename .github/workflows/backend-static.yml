name: Backend Static Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-static.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend source and tests
        run: python -m compileall -q backend
