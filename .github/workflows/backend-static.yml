name: Repository Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "studio/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  workflow_dispatch:

# Cancel superseded CI runs for the same PR/branch to reduce queue time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-validation:
    timeout-minutes: 15
    name: Backend syntax and isolated regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 — immutable commit pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # actions/setup-python v6.3.0 — immutable commit pin.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.110.1" \
            "motor==3.3.1" \
            "pymongo==4.5.0" \
            "bcrypt==4.1.3" \
            "PyJWT>=2.10.1" \
            "python-dotenv>=1.0.1" \
            "pydantic>=2.6.4" \
            "email-validator>=2.2.0" \
            "pytest>=8.0.0"
      - name: Run isolated backend regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_admin_provisioning_unit.py tests/test_blog_visibility_unit.py tests/test_model_defaults_unit.py tests/test_contact_email_format_unit.py


  sanity-schema-validation:
    timeout-minutes: 5
    name: Sanity Studio schema syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Validate Sanity schema and configuration syntax
        run: |
          node --input-type=module --check < studio/schemas/portfolioProject.js
          node --input-type=module --check < studio/sanity.config.js

  frontend-validation:
    timeout-minutes: 15
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 — immutable commit pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        # actions/setup-node v7.1.0 — immutable commit pin.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies reproducibly
        id: install-dependencies
        working-directory: frontend
        run: npm ci
      - name: Report dependency security audit
        working-directory: frontend
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e '
            const fs = require("fs");
            let report;
            try {
              report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            } catch (error) {
              const message = "Dependency audit report unavailable or invalid: " + error.message;
              console.log(message);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Frontend dependency audit\\n\\n" + message + "\\n\\n_Audit is informational; this did not fail CI._\\n");
              process.exit(0);
            }
            const totals = report.metadata?.vulnerabilities || {};
            const vulnerabilities = report.vulnerabilities || {};
            console.log("Dependency audit summary:", JSON.stringify(totals));
            const fixLabel = (item) => item.fixAvailable === true ? "available" :
              item.fixAvailable === false ? "not available" :
              item.fixAvailable ? "available (potentially breaking)" : "unknown";
            for (const [name, item] of Object.entries(vulnerabilities)) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fix: fixLabel(item)
              }));
            }
            const summary = [
              "## Frontend dependency audit",
              "",
              "| Severity | Count |",
              "| --- | ---: |",
              ...["critical", "high", "moderate", "low", "info"].map((level) =>
                `| ${level} | ${totals[level] || 0} |`),
              "",
              "| Package | Severity | Direct | Vulnerable range | Fix |",
              "| --- | --- | --- | --- | --- |",
              ...Object.entries(vulnerabilities).map(([name, item]) =>
                `| ${name} | ${item.severity} | ${item.isDirect ? "yes" : "no"} | ${item.range || "—"} | ${fixLabel(item)} |`),
              "",
              "_This audit is informational and does not fail CI. Review and remediation are tracked separately._",
              ""
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '
      - name: Upload dependency audit report
        if: always() && steps.install-dependencies.outcome == 'success'
        # actions/upload-artifact v6.0.0 — immutable commit pin.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-npm-audit-${{ github.run_id }}
          path: frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run frontend regression tests
        working-directory: frontend
        env:
          CI: "true"
        # Fail closed: a missing test suite must not be reported as a passing gate.
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend for production
        if: always() && steps.install-dependencies.outcome == 'success'
        working-directory: frontend
        run: npm run build
