name: Frontend Build Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "studio/schemas/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches: [main, audit/site-expert-remediation-2026-11-20]
    paths:
      - "frontend/**"
      - "studio/schemas/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: React and Sanity SEO production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Trace vulnerable dependency paths
        run: |
          npm explain proxy-addr || true
          npm explain shell-quote || true
          npm explain axios || true
          npm explain react-router-dom || true
          npm explain zod || true
          npm explain postcss || true

      - name: Preview compatible audit fixes (dry run)
        run: |
          npm audit fix --dry-run --json > npm-audit-fix-plan.json || true
          node <<'NODE'
          const fs = require("node:fs");
          try {
            const plan = JSON.parse(fs.readFileSync("npm-audit-fix-plan.json", "utf8"));
            const summary = {
              added: plan.added,
              removed: plan.removed,
              changed: plan.changed,
              audited: plan.audited,
              vulnerabilities: plan.audit?.metadata?.vulnerabilities || plan.metadata?.vulnerabilities,
            };
            console.log(JSON.stringify(summary, null, 2));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```json\n" + JSON.stringify(summary, null, 2) + "\n```\n");
          } catch (error) {
            console.log("Could not parse npm audit fix plan:", error.message);
          }
          NODE

      - name: Audit dependency advisories (report only)
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const files = ["npm-audit-all.json", "npm-audit-production.json"];
          for (const file of files) {
            try {
              const report = JSON.parse(fs.readFileSync(file, "utf8"));
              const v = report.metadata?.vulnerabilities || {};
              const line = `${file}: ${v.total ?? "unknown"} total (critical ${v.critical ?? "?"}, high ${v.high ?? "?"}, moderate ${v.moderate ?? "?"}, low ${v.low ?? "?"})`;
              console.log(line);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${line}\n`);
            } catch (error) {
              const line = `${file}: report unavailable — ${error.message}`;
              console.log(line);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${line}\n`);
            }
          }
          NODE

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: id9-npm-audit-reports
          path: |
            frontend/npm-audit-all.json
            frontend/npm-audit-production.json
            frontend/npm-audit-fix-plan.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Build frontend and generate static SEO routes
        env:
          REACT_APP_SANITY_PROJECT_ID: mqrbsugj
          REACT_APP_SANITY_DATASET: production
          REACT_APP_SANITY_API_VERSION: "2024-01-01"
        run: npm run vercel-build
