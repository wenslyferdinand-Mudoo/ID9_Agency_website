name: Frontend Build Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "studio/schemas/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches: [main, audit/site-expert-remediation-2026-11-20]
    paths:
      - "frontend/**"
      - "studio/schemas/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: React and Sanity SEO production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend and generate static SEO routes
        env:
          REACT_APP_SANITY_PROJECT_ID: mqrbsugj
          REACT_APP_SANITY_DATASET: production
          REACT_APP_SANITY_API_VERSION: "2024-01-01"
        run: npm run vercel-build
