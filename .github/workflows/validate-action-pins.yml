name: Validate GitHub Actions supply-chain pins

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/validate_github_action_pins.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/validate_github_action_pins.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  immutable-action-pins:
    name: Verify immutable third-party action references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 — immutable commit pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate all workflow action references
        run: python3 scripts/validate_github_action_pins.py
