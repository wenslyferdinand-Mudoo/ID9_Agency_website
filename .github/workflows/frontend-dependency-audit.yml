name: Frontend Dependency Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/frontend-dependency-audit.yml"
  workflow_dispatch:

# Cancel superseded CI runs for the same PR/branch to reduce queue time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    timeout-minutes: 15
    name: Audit locked frontend dependency tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 — immutable commit pin.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # actions/setup-node v7.1.0 — immutable commit pin.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependency graph without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Capture full and production dependency audits
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-full.json
          FULL_EXIT=$?
          npm audit --omit=dev --json > npm-audit-production.json
          PROD_EXIT=$?
          printf "Full audit exit code: %s\nProduction audit exit code: %s\n" "$FULL_EXIT" "$PROD_EXIT" > npm-audit-exit-codes.txt
          exit 0

      - name: Publish actionable audit summary
        if: always()
        working-directory: frontend
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = [
            { label: 'All dependencies', file: 'npm-audit-full.json' },
            { label: 'Production dependencies', file: 'npm-audit-production.json' }
          ];
          const levels = ['critical', 'high', 'moderate', 'low', 'info'];
          const lines = [
            '## Frontend dependency security audit',
            '',
            '> Informational security report. Findings are not automatically fixed and this workflow does not treat an audit finding as a CI test failure.',
            ''
          ];
          let parseFailures = 0;

          for (const entry of files) {
            const fullPath = path.join(process.cwd(), entry.file);
            let report;
            try {
              report = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            } catch (error) {
              parseFailures++;
              lines.push(`### ${entry.label}`, '', `Could not parse report: ${error.message}`, '');
              continue;
            }

            const counts = report.metadata?.vulnerabilities || {};
            const vulnerabilities = Object.entries(report.vulnerabilities || {});
            lines.push(
              `### ${entry.label}`,
              '',
              '| Critical | High | Moderate | Low | Total |',
              '| ---: | ---: | ---: | ---: | ---: |',
              `| ${counts.critical || 0} | ${counts.high || 0} | ${counts.moderate || 0} | ${counts.low || 0} | ${counts.total || 0} |`,
              ''
            );

            if (report.error) {
              lines.push(`npm audit reported an error: ${report.error.summary || report.error.code || 'see JSON artifact'}`, '');
            }

            if (vulnerabilities.length) {
              lines.push(
                '| Package | Severity | Direct dependency | Fix information |',
                '| --- | --- | --- | --- |'
              );
              vulnerabilities
                .sort((a, b) => levels.indexOf(a[1].severity) - levels.indexOf(b[1].severity) || a[0].localeCompare(b[0]))
                .forEach(([name, item]) => {
                  const fix = item.fixAvailable === true ? 'Available' :
                    item.fixAvailable === false ? 'No compatible fix reported' :
                    item.fixAvailable && typeof item.fixAvailable === 'object'
                      ? `Update to ${item.fixAvailable.version || item.fixAvailable.name || 'review required'}${item.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                      : 'Unknown';
                  lines.push(`| ${name} | ${item.severity} | ${item.isDirect ? 'Yes' : 'No'} | ${fix} |`);
                });
              lines.push('');
            } else {
              lines.push('No package vulnerabilities were reported.', '');
            }
          }

          try {
            const exitCodes = fs.readFileSync('npm-audit-exit-codes.txt', 'utf8').trim();
            lines.push('### npm audit process status', '', '```text', exitCodes, '```', '');
          } catch {
            lines.push('Audit process exit-code file was unavailable.', '');
          }

          lines.push(
            '### Remediation policy',
            '',
            '- Review production-impacting critical and high findings first.',
            '- Prefer targeted, lockfile-preserving updates and validate the complete test/build suite.',
            '- Do not use `npm audit fix --force` as an unattended remediation strategy.',
            '- Keep dependency migrations separate from CI action/runtime maintenance when they require broader compatibility work.',
            ''
          );

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          if (parseFailures) {
            console.error(`Failed to parse ${parseFailures} audit report(s).`);
            process.exitCode = 1;
          }
          NODE

      - name: Upload machine-readable audit reports
        if: always()
        # actions/upload-artifact v6.0.0 — immutable commit pin.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-npm-audit-reports
          path: |
            frontend/npm-audit-full.json
            frontend/npm-audit-production.json
            frontend/npm-audit-exit-codes.txt
          if-no-files-found: error
          retention-days: 14
